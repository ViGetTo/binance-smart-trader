[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-smart-trader"
version = "0.3.0"
description = "Virtual-only Binance Spot research and trading system"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<0.29", "websockets>=15,<16", "pandas>=2.2,<3",
  "numpy>=2,<3", "python-dotenv>=1,<2", "streamlit>=1.50,<2",
  "rich>=13.9,<15", "textual>=3,<8"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "respx>=0.22,<0.23", "ruff>=0.11,<1"]
[project.scripts]
smart-trader = "smart_trader.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
